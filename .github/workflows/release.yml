name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # CI has no Developer ID; releases are ad-hoc signed.
      AEROSPACE_SIDEBAR_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7
      - run: brew install just
      - name: Build tests
        timeout-minutes: 15
        run: swift build --build-tests
      - name: Tests and coverage gate
        timeout-minutes: 10
        # A pseudo-terminal keeps test output line-buffered, so a hang shows the last test that started.
        run: script -q /dev/null just coverage
      - name: Build archives
        run: just release-archives "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
