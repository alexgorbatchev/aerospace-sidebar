name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Swift tests
        timeout-minutes: 15
        uses: ./.github/actions/prepare-swift
      - name: Repeated arrival-scroll checks
        timeout-minutes: 5
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: |
          for attempt in {1..10}; do
            echo "Arrival-scroll run $attempt/10"
            just _scratch-tmpdir swift test --skip-build --enable-code-coverage --filter ArrivalScrollHostedTests
          done
      - name: Tests and coverage gate
        timeout-minutes: 10
        env:
          # The runner has no user to disturb, so the tests that show windows on screen run too.
          AEROSPACE_SIDEBAR_SCREEN_TESTS: "1"
        # A pseudo-terminal keeps test output line-buffered, so a hang shows the last test that started.
        run: script -q /dev/null just coverage
